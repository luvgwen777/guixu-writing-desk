<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>归墟写作台</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #111;
      color: #f2f2f2;
      padding: 24px;
    }
    .card {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    p {
      line-height: 1.8;
      color: #ccc;
    }
    .tag {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #2e5cff;
      color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>归墟写作台</h1>
    <p>如果你看到这个页面，说明网页 App 已经成功运行。</p>
    <p>下一步，我们会把它升级成真正的小说项目管理工具。</p>
    <div class="tag">PWA 测试成功</div>
  </div>
</body>
</html>
